name: Test 32-bit arch

on:
  push:
    paths-ignore:
      - docs/**
  pull_request:
    paths-ignore:
      - docs/**

permissions: {}

# A new push to a pull request cancels the run of the previous one. Every push to a branch gets a
# group of its own: a group keeps one pending run, so a series of pushes would cancel the middle
# ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        go-version: [ 1.25.x ]

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test 32-bit arch
        run: make test.32-bit
