name: Linearizability

# The check is random and takes long, so it runs on a schedule instead of on every change.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: How long to check, as a Go duration, shared by the configurations
        default: 20m

permissions: {}

# A manual run while another one is in progress waits for it rather than cancel it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lincheck:
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-latest, ubuntu-24.04-arm ]

    runs-on: ${{ matrix.platform }}

    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache-dependency-path: lincheck/go.sum

      - name: Check linearizability
        working-directory: lincheck
        env:
          LINCHECK_DURATION: ${{ inputs.duration || '20m' }}
          LINCHECK_OUT: ${{ runner.temp }}/lincheck
        run: |
          mkdir -p "$LINCHECK_OUT"
          go test -timeout 0 -v .

      - name: Upload visualizations
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lincheck-${{ matrix.platform }}
          path: ${{ runner.temp }}/lincheck
          if-no-files-found: ignore
