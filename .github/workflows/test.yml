name: Test

on:
  push:
    paths-ignore:
      - docs/**
  pull_request:
    paths-ignore:
      - docs/**

permissions: {}

# A new push to a pull request cancels the run of the previous one. Every push to a branch gets a
# group of its own: a group keeps one pending run, so a series of pushes would cancel the middle
# ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [ 1.25.x ]
        # arm64 has a weaker memory model than amd64: a missing barrier or a wrong order of atomic
        # operations shows up there first.
        platform: [ ubuntu-latest, ubuntu-24.04-arm ]

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: read

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Unit tests
        run: make test.unit

      - name: Process coverage report
        if: matrix.platform == 'ubuntu-latest'
        run: bash ./.github/workflows/scripts/coverage-report.sh
        env:
          INPUT_COVERAGE: coverage.txt

      - name: Upload badge to Gist
        uses: popsiclestick/gist-sync-action@88f8633178625914f2a01abf1a765f7272a580fa # v1.2.0
        if: >
          success()
          && matrix.platform == 'ubuntu-latest'
          && hashFiles('coverage.svg') != ''
          && !github.event.repository.fork
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          gist_url: https://gist.github.com/maypok86/2aae2cd39836dc7c258df7ffec602d1c
          auth: ${{ secrets.GIST_TOKEN }}
          gist_description: Otter's coverage badge
          github_file: coverage.svg
          gist_title: coverage.svg

      - name: Upload report to Gist
        uses: popsiclestick/gist-sync-action@88f8633178625914f2a01abf1a765f7272a580fa # v1.2.0
        if: >
          success()
          && matrix.platform == 'ubuntu-latest'
          && hashFiles('coverage.html') != ''
          && !github.event.repository.fork
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          gist_url: https://gist.github.com/maypok86/97c79c864eb1e0fea3a7c430f39acc82
          auth: ${{ secrets.GIST_TOKEN }}
          gist_description: Otter's coverage report
          github_file: coverage.html
          gist_title: coverage.html
